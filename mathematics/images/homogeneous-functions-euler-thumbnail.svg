<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2a4a" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#0d1638"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- subtle orange glow accents -->
  <circle cx="1120" cy="140" r="260" fill="#ff8c00" opacity="0.06"/>
  <circle cx="120" cy="620" r="200" fill="#ff8c00" opacity="0.05"/>

  <!-- decorative formula fragments -->
  <text x="960" y="230" font-family="Georgia, serif" font-size="46" fill="#3a4a75" opacity="0.55">f(tx,ty) = t</text>
  <text x="1178" y="212" font-family="Georgia, serif" font-size="26" fill="#3a4a75" opacity="0.55">n</text>
  <text x="1000" y="290" font-family="Georgia, serif" font-size="30" fill="#3a4a75" opacity="0.4">f(x,y)</text>

  <text x="90" y="150" font-family="Georgia, serif" font-size="40" fill="#3a4a75" opacity="0.5">x</text>
  <text x="118" y="140" font-family="Georgia, serif" font-size="24" fill="#3a4a75" opacity="0.5">2</text>
  <text x="150" y="150" font-family="Georgia, serif" font-size="40" fill="#3a4a75" opacity="0.5">f</text>
  <text x="175" y="140" font-family="Georgia, serif" font-size="24" fill="#3a4a75" opacity="0.5">x</text>
  <text x="200" y="150" font-family="Georgia, serif" font-size="40" fill="#3a4a75" opacity="0.5"> + xyf</text>
  <text x="345" y="140" font-family="Georgia, serif" font-size="24" fill="#3a4a75" opacity="0.5">y</text>
  <text x="365" y="150" font-family="Georgia, serif" font-size="40" fill="#3a4a75" opacity="0.5"> = nf</text>

  <!-- thin orange rule -->
  <rect x="0" y="600" width="1280" height="2" fill="#ff8c00" opacity="0.35"/>

  <!-- orange title bar, bottom-left -->
  <rect x="0" y="616" width="760" height="104" fill="#ff8c00"/>
  <text x="48" y="662" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0a1128">HOMOGENEOUS FUNCTIONS</text>
  <text x="48" y="700" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0a1128">Testing by Powers &amp; Euler's Theorem</text>
</svg>
